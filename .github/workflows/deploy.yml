# Builds main and publishes it to the gh-pages branch, which GitHub Pages serves.
# PR previews live in gh-pages too, under pr-preview/ (see preview.yml), so this leaves that folder alone.
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

# One write to gh-pages at a time, shared with preview.yml.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # Serve the files as they are, without Jekyll.
      - name: Skip Jekyll
        run: touch dist/.nojekyll
      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: dist
          clean-exclude: pr-preview/
          force: false
